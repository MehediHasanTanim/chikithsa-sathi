name: chamber-management

x-api-image: &api-image
  build:
    context: .
    dockerfile: Dockerfile
  image: chamber-management-api:local

x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 3000
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://chamber:chamber@postgres:5432/chamber_management?schema=public&connection_limit=10}
  REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
  APP_NAME: ${APP_NAME:-Chamber Management API}
  APP_URL: ${APP_URL:-http://localhost:3000}
  ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
  LOG_LEVEL: ${LOG_LEVEL:-log}
  TIMEZONE: ${TIMEZONE:-Asia/Dhaka}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-120}
  API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-only-access-secret-replace-before-production}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-only-refresh-secret-replace-before-production}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
  OTP_EXPIRY_SECONDS: ${OTP_EXPIRY_SECONDS:-600}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
  AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-5}
  AUTH_LOCKOUT_SECONDS: ${AUTH_LOCKOUT_SECONDS:-900}
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
  SMS_ENABLED: ${SMS_ENABLED:-false}
  SMS_PROVIDER: ${SMS_PROVIDER:-}
  SMS_TWILIO_ACCOUNT_SID: ${SMS_TWILIO_ACCOUNT_SID:-}
  SMS_TWILIO_AUTH_TOKEN: ${SMS_TWILIO_AUTH_TOKEN:-}
  SMS_TWILIO_FROM: ${SMS_TWILIO_FROM:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chamber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chamber}
      POSTGRES_DB: ${POSTGRES_DB:-chamber_management}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - chamber_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - chamber_network

  migrate:
    image: chamber-management-api:local
    restart: 'no'
    user: root
    environment: *api-environment
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chamber_network

  api:
    <<: *api-image
    restart: unless-stopped
    environment: *api-environment
    command: ['node', 'dist/main']
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - chamber_network

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    profiles: ['observability']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle=false'
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    networks:
      - chamber_network

  alertmanager:
    build:
      context: ./docker/alertmanager
    image: chamber-management-alertmanager:local
    restart: unless-stopped
    profiles: ['observability']
    environment:
      ALERT_WEBHOOK_URL_FILE: /run/secrets/alert_webhook_url
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - alertmanager_data:/alertmanager
    secrets:
      - alert_webhook_url
    networks:
      - chamber_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:

secrets:
  metrics_token:
    file: ./docker/prometheus/metrics-token
  alert_webhook_url:
    file: ./docker/alertmanager/alert-webhook-url

networks:
  chamber_network:
    driver: bridge
