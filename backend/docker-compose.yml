services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chamber
      POSTGRES_PASSWORD: chamber
      POSTGRES_DB: chamber_management
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chamber -d chamber_management']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://chamber:chamber@postgres:5432/chamber_management?schema=public&connection_limit=10
      REDIS_URL: redis://redis:6379
      ENABLE_SWAGGER: 'true'
      TIMEZONE: Asia/Dhaka
      JWT_ACCESS_SECRET: development-only-access-secret-replace-before-production
      JWT_REFRESH_SECRET: development-only-refresh-secret-replace-before-production
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
