name: chamber-management-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # This is browser-visible and therefore deliberately points to the host API.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ChamberCare}
    image: chamber-management-web:local
    restart: unless-stopped
    ports:
      # Keep the API's default port (3000) free; override WEB_PORT when needed.
      - '127.0.0.1:${WEB_PORT:-3001}:3000'
